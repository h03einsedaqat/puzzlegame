apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * پیکربندی امضای انتشار از فایل محلی android/keystore.properties خوانده می‌شود.
 * این فایل و خود keystore هرگز وارد مخزن نمی‌شوند؛ نمونه‌ی آن در
 * keystore.properties.example قرار دارد.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

react {
    autolinkLibrariesWithApp()
}

/** برای فعال‌کردن کوچک‌سازی کد در نسخه انتشار، این مقدار را true کنید (پس از تست کامل). */
def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * فونت‌های فارسی بخشی از رابط کاربری‌اند و باید در بسته باشند. Android فقط
 * فونت‌های داخل `assets/fonts` بسته را می‌شناسد، پس پیش از هر ساخت از منبع
 * واحد src/assets/fonts کپی می‌شوند تا هرگز بسته‌ای بدون فونت ساخته نشود.
 */
def copyFonts = tasks.register('copyFonts', Copy) {
    from rootProject.file('../src/assets/fonts')
    include '*.ttf'
    into file('src/main/assets/fonts')
}

tasks.named('preBuild').configure { dependsOn(copyFonts) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "ir.kalamesaz.game"
    defaultConfig {
        applicationId "ir.kalamesaz.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        resConfigs "fa", "en"
    }

    /**
     * امضا: علاوه بر امضای v2 (که اندروید ۷+ می‌شناسد) امضای v1 (JAR) را هم
     * عمداً روشن می‌کنیم. دلیلش این است که AGP وقتی minSdkVersion ≥ 24 باشد
     * خودش امضای v1 را خاموش می‌کند و بعضی نصب‌کننده‌های گوشی (رابط‌های اختصاصی
     * سامسونگ/شیائومی/وان‌پلاس/هواوی و فایل‌منیجرهایی که خودشان APK را می‌خوانند)
     * بسته‌ای که فقط امضای v2 دارد را با پیام
     * «App not installed as package appears to be invalid» رد می‌کنند.
     * روشن بودن v1 هیچ ضرری ندارد؛ اندروید ۷+ همان v2 را بررسی می‌کند.
     */
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    /**
     * با دستور `./gradlew assembleRelease -PabiSplits=true` برای هر معماری یک
     * بسته جدا ساخته می‌شود که برای بارگذاری چندبسته‌ای در پیشخان بازار مناسب است.
     */
    if (project.hasProperty("abiSplits")) {
        splits {
            abi {
                reset()
                enable true
                universalApk true
                include "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/*.version"]
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
