# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# معماری‌های خروجی. برای انتشار، ساخت با معماری‌های arm کافی است و حجم بسته را
# به‌طور محسوس کاهش می‌دهد؛ دستورهای آماده در README آمده است.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false
