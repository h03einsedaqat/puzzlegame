name: Android APK

# این گردش‌کار، بسته نصبی اندروید را روی سرور گیت‌هاب می‌سازد؛ برای کسی که
# JDK و Android SDK روی رایانه‌اش نصب نیست، سریع‌ترین راه گرفتن APK است.
# بسته خروجی با کلید debug امضا می‌شود: برای نصب و آزمایش روی گوشی مناسب است،
# ولی برای بارگذاری در کافه‌بازار باید با کلید انتشار خودت بسازی
# (راهنما: docs/BUILD_AND_RUN.md).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK state
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -30 || true

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"; do
            echo "installing $pkg"
            "$SM" "$pkg" || echo "skipped $pkg (gradle will try to fetch it)"
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Verify project
        run: |
          npx tsc --noEmit
          npx eslint .
          npx jest
          npm run data:check

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Report APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK"
          {
            echo "### بسته نصبی آماده است"
            echo
            echo "- فایل: \`app-release.apk\`"
            echo "- اندازه: $(du -h "$APK" | cut -f1)"
            echo "- معماری‌ها: arm64-v8a, armeabi-v7a"
            echo "- امضا: کلید debug (فقط برای نصب آزمایشی روی گوشی)"
            echo
            echo "برای انتشار در کافه‌بازار، با کلید خودت بساز: \`npm run android:apk:release\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalamesaz-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
